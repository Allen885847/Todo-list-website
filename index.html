<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, focused to-do list." />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">Your day, clearly planned</p>
          <label class="sr-only" for="list-title">Todo list title</label>
          <input
            id="list-title"
            class="list-title"
            type="text"
            value="Today’s focus"
            maxlength="60"
            aria-describedby="title-help"
          />
          <p id="title-help" class="title-help">Click the title to rename your list.</p>
        </header>

        <form id="task-form" class="task-form">
          <label for="task-input">Describe your task naturally</label>
          <div class="task-entry">
            <input
              id="task-input"
              type="text"
              placeholder="e.g. Submit my history essay next Friday"
              maxlength="300"
              autocomplete="off"
              required
            />
            <button id="add-task-button" type="submit">Ask AI</button>
          </div>
          <p id="form-status" class="form-status" aria-live="polite">
            AI will find the date and task for you.
          </p>
        </form>

        <div class="list-heading">
          <h1 id="page-title">Tasks</h1>
          <p id="task-count" aria-live="polite">0 tasks</p>
        </div>

        <ul id="task-list" class="task-list" aria-label="Todo tasks"></ul>

        <div id="empty-state" class="empty-state">
          <span aria-hidden="true">✓</span>
          <p>Your list is clear.</p>
          <small>Add your first task above.</small>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
